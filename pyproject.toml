[project]
name = "voicetiny-rp2040"
version = "0.1.0"
description = "Reproducible keyword spotting experiments for RP2040"
requires-python = ">=3.12,<3.13"
dependencies = [
  "librosa==0.10.2.post1",
  "resampy==0.4.3",
  "numpy==2.2.6",
  "pandas==2.2.3",
  "PyYAML==6.0.2",
  "scikit-learn==1.6.1",
  "soundfile==0.13.1",
]

[project.optional-dependencies]
train = ["torch==2.6.0"]
dev = ["pytest==8.3.5", "ruff==0.11.2"]
embedded = ["mpremote==1.29.0", "pyserial==3.5"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
